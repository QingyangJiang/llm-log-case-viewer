# Add this location INSIDE an existing HTTPS Nginx server block.
# The certificate and pets.example.com DNS are configured on that gateway.
# Only expiring sprite images become reachable through this HTTPS address.
location ~ ^/codex-pets/([A-Za-z0-9_-]{43})\.png$ {
  limit_except GET { deny all; }
  proxy_pass http://CASELENS_HOST:8080/api/pet/codex-sprite/$1;
  proxy_set_header Host $host;
  proxy_read_timeout 30s;
}
