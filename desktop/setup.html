<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>连接 CaseLens · 小镜</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:30px;color:#294332;background:linear-gradient(140deg,#eff9e8,#f6f1e8);font:13px system-ui,sans-serif}
    header{display:flex;align-items:center;gap:11px}header i{width:36px;height:36px;display:grid;place-items:center;border-radius:15px;background:#d9f5ac;font-size:23px;font-style:normal}h1{margin:0;font-size:18px}p{margin:8px 0 16px;color:#708175;font-size:11px;line-height:1.5}
    label{display:block;margin-bottom:6px;font-size:11px;font-weight:700}input{width:100%;height:40px;padding:0 12px;border:1px solid #9cb5a1;border-radius:10px;background:white;font-size:12px;outline:none}input:focus{border-color:#438957}
    footer{display:flex;align-items:center;justify-content:space-between;margin-top:14px}button{height:35px;padding:0 16px;border:1px solid #527d56;border-radius:9px;background:#dcf6b9;font-size:12px;font-weight:700;cursor:pointer}#error{max-width:230px;color:#a54543;font-size:10px}
  </style>
</head>
<body>
  <header><i>◉</i><h1>把小镜带到桌面</h1></header>
  <p>只需设置一次 CaseLens 内网地址。首次打开宠物后，再用 CaseLens 账号登录。</p>
  <form id="form"><label for="address">CaseLens 服务器地址</label><input id="address" type="url" placeholder="http://内网IP:8080" required autocomplete="url"><footer><span id="error" role="alert"></span><button type="submit">唤醒小镜 →</button></footer></form>
  <script src="./setup.js"></script>
</body>
</html>
